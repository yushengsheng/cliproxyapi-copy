name: Native build and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified release after all builds pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            architecture: arm64
            python: .venv/bin/python
          - name: macOS-x86_64
            os: macos-15-intel
            architecture: x64
            python: .venv/bin/python
          - name: Windows-x64
            os: windows-2022
            architecture: x64
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Install into a fresh environment
        shell: bash
        env:
          TASK_PYTHON: ${{ matrix.python }}
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "macOS" && "$RUNNER_ARCH" == "X64" ]]; then
            export OPENSSL_STATIC=1
            export OPENSSL_DIR="$(brew --prefix openssl@3)"
          fi
          "$TASK_PYTHON" -m pip install --disable-pip-version-check -r requirements-build.txt
          "$TASK_PYTHON" -m pip check
      - name: Run all source and desktop tests
        shell: bash
        env:
          TASK_PYTHON: ${{ matrix.python }}
        run: |
          "$TASK_PYTHON" -m unittest discover -s tests -v
          "$TASK_PYTHON" -m compileall -q cliproxy_config scripts tests launch.py
          "$TASK_PYTHON" launch.py --self-check
      - name: Build native application
        shell: bash
        env:
          TASK_PYTHON: ${{ matrix.python }}
        run: '"$TASK_PYTHON" scripts/build.py'
      - name: Extract and verify the packaged application
        shell: bash
        env:
          TASK_PYTHON: ${{ matrix.python }}
        run: '"$TASK_PYTHON" scripts/verify_release.py'
      - name: Save verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.check.json

  release:
    name: Publish verified release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Validate manifests and prepare release notes
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/release_manifest.py
      - name: Publish new version after every platform passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag="v$RELEASE_VERSION"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; choose a new version before publishing."
            exit 1
          fi
          gh release create "$release_tag" dist/*.zip dist/*.check.json dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "CLIProxyAPI 配置助手 $release_tag" \
            --notes-file release-notes.md --latest
